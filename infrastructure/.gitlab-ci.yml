stages:
  - release
  - deploy

release-to-nexus:
  stage: release
  image: alpine/helm:3.16.2
  script:
    - cd infrastructure/momo-store-chart
    - helm package --dependency-update . --version ${CI_PIPELINE_ID}
    - curl -u $NEXUS_USER:$NEXUS_PASS $NEXUS_HELM_REPO --upload-file *.tgz -v

deploy-to-kubernetes:
  stage: deploy
  image: alpine/helm:3.16.2
  needs:
    - release-to-nexus
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - apk add jq
  script:
    - |
      if helm list -n momo-store 2>/dev/null | grep -q momo-store; then
        export BACKEND_VERSION=$(helm get values -n momo-store momo-store -o json | jq -r .backend.image.tag)
        export FRONTEND_VERSION=$(helm get values -n momo-store momo-store -o json | jq -r .frontend.image.tag)
        echo "Using existing versions: backend=$BACKEND_VERSION, frontend=$FRONTEND_VERSION"
      else
        export BACKEND_VERSION=${CI_PIPELINE_ID}
        export FRONTEND_VERSION=${CI_PIPELINE_ID}
        echo "FIRST DEPLOYMENT - using versions: backend=$BACKEND_VERSION, frontend=$FRONTEND_VERSION"
      fi
    - cd infrastructure/momo-store-chart
    - helm upgrade --dependency-update --install --atomic -n momo-store momo-store . --set backend.image.tag=$BACKEND_VERSION --set frontend.image.tag=$FRONTEND_VERSION --set grafana.adminPassword=$GRAFANA_ADM_PWD
    - rm ~/.kube/config
  when: manual
